# OpenOCD configuration for DJI RoboMaster C board / STM32F407
# Debug probe: ATK/ALIENTEK wireless debugger in CMSIS-DAP mode.
#
# Use this file in CLion's OpenOCD configuration instead of stm32f4discovery.cfg.
# If connection is unstable, lower adapter speed to 400.

source [find interface/cmsis-dap.cfg]

# ATK wireless debugger usually enumerates as a CMSIS-DAP HID device.
# Keeping this explicit avoids OpenOCD choosing a backend that can open the
# probe but behaves poorly on some Windows driver setups.
cmsis_dap_backend hid

# DJI C board uses SWD.
transport select swd

source [find target/stm32f4x.cfg]

# Keep speed conservative for wireless CMSIS-DAP. Put this after the target file
# so it wins if the target script sets its own default adapter speed.
adapter speed 400

# Use this when the debugger's NRST wire is not connected.
reset_config none
