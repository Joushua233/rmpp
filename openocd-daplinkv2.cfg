# OpenOCD configuration for DJI RoboMaster C board with a DAPLink/CMSIS-DAP probe.
#
# CLion:
#   Run/Debug Configurations -> OpenOCD Download & Run
#   Board config file: this file

source [find interface/cmsis-dap.cfg]

# DAPLink CMSIS-DAP v2 appears under "Universal Serial Bus devices" on
# Windows and is accessed by OpenOCD through the WinUSB/libusb bulk backend.
cmsis_dap_backend usb_bulk

transport select swd

# Lower this to 1000 or 2000 if wiring is long or reset/connect is unstable.
adapter speed 2000

# DJI RoboMaster C board uses an STM32F407 series MCU.
source [find target/stm32f4x.cfg]

# Most DAPLink probes expose SWDIO/SWCLK only. This avoids depending on a
# physical nRESET wire while still allowing OpenOCD to reset through the core.
reset_config none

# Make debugger attach behavior predictable in CLion.
$_TARGETNAME configure -event gdb-attach {
    halt
}

$_TARGETNAME configure -event gdb-detach {
    resume
}
